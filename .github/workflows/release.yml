name: Release the packed script

# Every push to main that touches a df_*.gsc source (or the packing tools) publishes a release with the packed
# build attached: two files, zm_transit_dead_frequency_1.gsc and _2.gsc (a compiled T6 script is capped at 65535
# bytes of unique strings, the sources need two). A push that only changes README.md, docs/, companion/ or
# tools/pickers does not match the paths filter, so no release is created.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'df_*.gsc'
      - 'tools/catalog_stub.gsc'
      - 'tools/pack.pl'
      - 'tools/build.pl'
      - 'tools/check_links.pl'
      - 'tools/lint_includes.pl'
      - 'tools/lint_sounds.pl'
      - 'tools/lint_calls.pl'
      - 'tools/assets/soundbank/**'
      - 'tools/vanilla_namespaces.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:          # a release can also be started by hand from the Actions tab
    inputs:
      parts:
        description: 'How many packed files (2 is what the sources need today; 1 is refused as oversized)'
        required: false
        default: '2'

permissions:
  contents: write             # needed to create the release and upload the assets

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2      # the previous commit, to list what actually changed

      - name: Show the changed files
        run: |
          echo "Changed in this push:"
          git diff --name-only HEAD^ HEAD || git show --name-only --pretty=format: HEAD

      - name: Lint the sources
        # lint_includes: a source calling a vanilla helper without the utility includes fails at load
        # lint_sounds: a sound alias that no TranZit bank carries is silent in game
        # lint_calls: a call to a helper that does not exist in T6 fails at load (skips where the vanilla dump is absent)
        run: perl tools/lint_includes.pl && perl tools/lint_sounds.pl && perl tools/lint_calls.pl

      - name: Check the cross-file calls
        run: perl tools/check_links.pl .

      - name: Pack the sources
        id: pack
        run: |
          PARTS="${{ github.event.inputs.parts }}"
          [ -z "$PARTS" ] && PARTS=2
          # pack.pl refuses a file whose string block would pass the engine limit (exit 3): try the asked
          # number of parts, then one more, then one more
          perl tools/pack.pl --out release/zm_transit_dead_frequency.gsc --parts "$PARTS" \
            || perl tools/pack.pl --out release/zm_transit_dead_frequency.gsc --parts $((PARTS + 1)) \
            || perl tools/pack.pl --out release/zm_transit_dead_frequency.gsc --parts $((PARTS + 2))
          VERSION=$(grep -m1 -o 'level\.df_version = "[^"]*"' df_main.gsc | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # the tag is the version; a second build of the same version gets the run number appended
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then TAG="v$VERSION-${{ github.run_number }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # the required companion script ships with every release, so a player needs nothing else from the repository
          cp companion/zm_transit_enhanced_noee.gsc release/
          ls -la release/

      - name: Compare with the latest release
        # A release is published only when the BUILD changed. A force-push, a rewritten commit or a push that touches
        # only tooling matched the paths filter yet produced the very same files: those runs end here.
        id: same
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          same=false
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern "zm_transit_*.gsc" --dir prev 2>/dev/null; then
            same=true
            for f in release/zm_transit_*.gsc; do
              b=$(basename "$f")
              # the header line carries the build date: ignore it when comparing
              if [ ! -f "prev/$b" ] || ! diff -q <(grep -v "generated by tools/pack.pl" "$f") <(grep -v "generated by tools/pack.pl" "prev/$b") >/dev/null; then
                same=false
              fi
            done
            [ "$(ls release/zm_transit_*.gsc | wc -l)" = "$(ls prev/zm_transit_*.gsc | wc -l)" ] || same=false
          fi
          echo "same=$same" >> "$GITHUB_OUTPUT"
          if [ "$same" = true ]; then echo "Build identical to the latest release: no new release."; else echo "Build differs from the latest release (or none yet): publishing."; fi

      - name: Publish the release
        if: steps.same.outputs.same != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pack.outputs.tag }}
          name: Dead Frequency ${{ steps.pack.outputs.version }}
          files: |
            release/zm_transit_dead_frequency*.gsc
            release/zm_transit_enhanced_noee.gsc
          body: |
            Packed build of the Dead Frequency Easter Egg for TranZit (Plutonium T6), version ${{ steps.pack.outputs.version }}.

            **Install** (full instructions in the README):
            1. Drop every `zm_transit_dead_frequency_*.gsc` file attached here into
               `%localappdata%\Plutonium\storage\t6\scripts\zm\zm_transit\` (a release always ships them all; replace the old ones).
            2. Drop `zm_transit_enhanced_noee.gsc` (attached here, required companion; credits in companion/README.md) into the same folder.
            3. Install Scavenger Project v1.9 by NickB_05 into `...\scripts\zm\` (required, not included).
            Nothing else from the repository belongs in the game folders: the `df_*.gsc` sources are already inside
            these files, and a second copy of a function makes the game refuse the script.

            **Check it loaded**: console `set df_debug 1`, then in chat `!df status`
            (it answers with the version ${{ steps.pack.outputs.version }}).

            Built from ${{ github.sha }} by `tools/pack.pl` (comments stripped, vanilla calls qualified, catalogue stubbed).
